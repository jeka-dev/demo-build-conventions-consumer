name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install JeKa
      run: |
        curl -sL https://jeka.dev/install.sh | bash -s - install
        echo "$HOME/.jeka/bin" >> "$GITHUB_PATH"
    - name: Build with JeKa, excluding the SonarQube analysis
      # Selenide runs the end-to-end test in Chrome: xvfb-run gives it a display
      run: xvfb-run jeka test pack e2eTest
